##########
# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html
##########
server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
    session:
      timeout: 30m

spring:
  application:
    name: semi-server
  servlet:
    multipart:
      max-file-size: 1024MB
  main:
    allow-bean-definition-overriding: true

  profiles:
    active: dev


mybatis:
  config-location: classpath:web-mybatis-config.xml


logging:
  config: classpath:logback.xml

app_web_assets_root: D:\IdeaProjects\data\zy\webs

springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true # 2.2 是否开启 Swagger 文档的 Knife4j UI 界面
  setting:
    language: zh_cn

wx:
  info:
    version: 1.0.0
    base-package: cn.iocoder.wx.module.semi
  web:
    admin-ui:
      url: http://dashboard.wx.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下 url，仅仅是为了演示，去掉配置也没关系
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  swagger:
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: ${wx.info.version}
  tenant: # 多租户相关配置项
    enable: false
    ignore-urls:
      - /admin-api/system/tenant/get-id-by-name # 基于名字获取租户，不许带租户编号
      - /admin-api/system/tenant/get-by-website # 基于域名获取租户，不许带租户编号
      - /admin-api/system/captcha/get-image # 获取图片验证码，和租户无关
      - /admin-api/system/captcha/get # 获取图片验证码，和租户无关
      - /admin-api/system/captcha/check # 校验图片验证码，和租户无关
      - /admin-api/system/sms/callback/* # 短信回调接口，无法带上租户编号
      - /rpc-api/system/tenant/valid # 防止递归。避免调用 /rpc-api/system/tenant/valid 接口时，又去触发 /rpc-api/system/tenant/valid 去校验
      - /rpc-api/system/tenant/id-list # 获得租户列表的时候，无需传递租户编号
      - /rpc-api/system/oauth2/token/check # 访问令牌校验时，无需传递租户编号；主要解决上传文件的场景，前端不会传递 tenant-id！
    ignore-tables:
      - resource
      - resource_data_type
      - resource_type
      - scene_def
      - signal_ling
      - material
      - file_only_info
      - file_info
      - file_download_info
      - engineering_data_list_row
      - engineering_data_list_column
      - engineering
      - device_status_ppfmter
      - device_status_cbds
      - device_info_ppfmter
      - device_info_cbds
      - component_info
      - batch_conversion
      - ssociation_object
      - alert_scheme
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
  sms-code: # 短信验证码相关的配置项
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 9999 # 这里配置 9999 的原因是，测试方便。


