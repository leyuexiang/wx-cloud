# 测试服务器独立配置；文档路由只读，密钥通过服务器环境变量注入。
spring:
  application:
    name: gateway-server
  main:
    allow-circular-references: true
  codec:
    # 场景四包沿用主网关的有界缓冲大小，避免测试入口先于服务拒绝正常保存。
    max-in-memory-size: 16MB
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    discovery:
      client:
        simple:
          instances:
            system-server:
            - uri: http://127.0.0.1:48181
            infra-server:
            - uri: http://127.0.0.1:48182
            dimensions-server:
            - uri: http://127.0.0.1:48192
    gateway:
      routes:
      # 文档精确路径优先于业务路由，只读改写到服务原有文档入口。
      - id: system-openapi-test148
        order: -10
        uri: http://127.0.0.1:48181
        predicates:
        - Method=GET
        - Path=/admin-api/system/v3/api-docs,/admin-api/system/v3/api-docs/**
        filters:
        - RemoveRequestHeader=x-bot-user
        - RewritePath=^/admin-api/system(?<docPath>/v3/api-docs(?:/.*)?)$, $\{docPath}
      - id: infra-openapi-test148
        order: -10
        uri: http://127.0.0.1:48182
        predicates:
        - Method=GET
        - Path=/admin-api/infra/v3/api-docs,/admin-api/infra/v3/api-docs/**
        filters:
        - RemoveRequestHeader=x-bot-user
        - RewritePath=^/admin-api/infra(?<docPath>/v3/api-docs(?:/.*)?)$, $\{docPath}
      - id: dimensions-openapi-test148
        order: -10
        uri: http://127.0.0.1:48192
        predicates:
        - Method=GET
        - Path=/admin-api/dimensions/v3/api-docs,/admin-api/dimensions/v3/api-docs/**
        filters:
        - RemoveRequestHeader=x-bot-user
        - RewritePath=^/admin-api/dimensions(?<docPath>/v3/api-docs(?:/.*)?)$, $\{docPath}
      # 前端公共字典只读路径转发到现有管理端认证链，不开放整个系统接口前缀。
      - id: system-dictionary-test148
        uri: http://127.0.0.1:48181
        predicates:
        - Path=/api/system/dict/data/type/{dictType}
        filters:
        - RemoveRequestHeader=x-bot-user
        - RewritePath=/api/system/dict/data/type/(?<dictType>[^/]+), /admin-api/system/dict/data/type/$\{dictType}
      - id: system-test148
        uri: http://127.0.0.1:48181
        predicates:
        - Path=/admin-api/system/**,/app-api/system/**
        filters:
        - RemoveRequestHeader=x-bot-user
      - id: infra-test148
        uri: http://127.0.0.1:48182
        predicates:
        - Path=/admin-api/infra/**,/app-api/infra/**
        filters:
        - RemoveRequestHeader=x-bot-user
      - id: dimensions-test148
        uri: http://127.0.0.1:48192
        predicates:
        - Path=/admin-api/dimensions/**,/app-api/dimensions/**,/admin-api/dim3d/**
        filters:
        - RemoveRequestHeader=x-bot-user
      x-forwarded:
        prefix-enabled: false
server:
  port: ${WX_GATEWAY_PORT:12532}
  address: 0.0.0.0
logging:
  file:
    name: /app/logs/wx-gateway.log
  level:
    root: INFO
knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
    - name: 系统服务
      service-name: system-server
      url: /admin-api/system/v3/api-docs
      context-path: /
    - name: 基础设施服务
      service-name: infra-server
      url: /admin-api/infra/v3/api-docs
      context-path: /
    - name: 三维服务
      service-name: dimensions-server
      url: /admin-api/dimensions/v3/api-docs
      context-path: /
wx:
  info:
    version: 1.0.0
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
