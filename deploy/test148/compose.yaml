# 使用测试服务器已有的 Java 17 运行环境；业务包均来自本地源码构建。
x-service: &service
  image: wx-cloud-runtime:test148
  network_mode: host
  restart: unless-stopped
  env_file: .env
  environment:
    # 使用操作系统的非阻塞安全随机源，避免容器启动时等待熵池。
    JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom --add-opens=java.base/java.io=ALL-UNNAMED
    TZ: Asia/Shanghai
  mem_limit: 1536m
  logging:
    options:
      max-size: 20m
      max-file: '3'

services:
  # 新实例只绑定回环地址，数据库文件使用独立卷；不接管宿主已有数据库。
  mysql:
    image: mysql:8.0.44
    container_name: mysql8
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WX_DB_PORT:-13306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${WX_MYSQL_ROOT_PASSWORD:?必须设置独立数据库管理员密码}
      TZ: Asia/Shanghai
    volumes:
      - wx-editor-mysql:/var/lib/mysql
    mem_limit: 1536m
    healthcheck:
      # 临时初始化实例不监听 TCP，避免将它误判为最终可用实例。
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot -NBe "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  redis:
    image: redis:7.4.2-alpine
    container_name: wx-editor-redis
    restart: unless-stopped
    ports:
      - 127.0.0.1:16380:6379
    environment:
      WX_REDIS_PASSWORD: ${WX_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --requirepass "$$WX_REDIS_PASSWORD" --appendonly yes']
    volumes:
      - wx-editor-redis:/data
    mem_limit: 256m
  system:
    <<: *service
    container_name: wx-editor-system
    healthcheck:
      # 端口由服务器 .env 注入，与发布配置中的隔离端口保持一致。
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:${WX_SYSTEM_PORT:-48181}/actuator/health || exit 1']
      interval: 15s
      start_period: 60s
    entrypoint: [java, -Xms128m, -Xmx1024m, -jar, /opt/wx/app.jar, --spring.config.location=file:/opt/wx/application.yaml]
    volumes:
      - ./jars/system.jar:/opt/wx/app.jar:ro
      - ./config/system.yaml:/opt/wx/application.yaml:ro
  infra:
    <<: *service
    container_name: wx-editor-infra
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:${WX_INFRA_PORT:-48182}/actuator/health || exit 1']
      interval: 15s
      start_period: 60s
    entrypoint: [java, -Xms128m, -Xmx1024m, -jar, /opt/wx/app.jar, --spring.config.location=file:/opt/wx/application.yaml]
    volumes:
      - ./jars/infra.jar:/opt/wx/app.jar:ro
      - ./config/infra.yaml:/opt/wx/application.yaml:ro
  dimensions:
    <<: *service
    container_name: wx-editor-dimensions
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:${WX_DIMENSIONS_PORT:-48192}/actuator/health || exit 1']
      interval: 15s
      start_period: 60s
    entrypoint: [java, -Xms128m, -Xmx1024m, -jar, /opt/wx/app.jar, --spring.config.location=file:/opt/wx/application.yaml]
    volumes:
      - ./jars/dimensions.jar:/opt/wx/app.jar:ro
      - ./config/dimensions.yaml:/opt/wx/application.yaml:ro
      - ./data:/data
  gateway:
    <<: *service
    container_name: wx-editor-gateway
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:$$WX_GATEWAY_PORT/actuator/health || exit 1']
      interval: 15s
      start_period: 30s
    entrypoint: [java, -Xms128m, -Xmx512m, -jar, /opt/wx/app.jar, --spring.config.location=file:/opt/wx/application.yaml]
    volumes:
      - ./jars/gateway.jar:/opt/wx/app.jar:ro
      - ./config/gateway.yaml:/opt/wx/application.yaml:ro

volumes:
  wx-editor-mysql:
  wx-editor-redis:
