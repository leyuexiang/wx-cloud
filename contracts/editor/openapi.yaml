          $ref: '#/components/schemas/PublishedDependenciesResponse'
  /operation/dim3d/scenePreview/resolve:
    get:
      tags:
      - preview
      summary: 解析发布预览票据
      security: []
      parameters:
      - name: sceneId
        in: query
        required: true
        schema:
          type: string
      - name: password
        in: query
        schema:
          type: string
          writeOnly: true
      responses:
        '200':
          $ref: '#/components/schemas/PreviewResolveResponse'
  /tenant/web/dim3d/scene/page:
    get:
      tags:
      - scene
      summary: 场景分页
      security:
      - bearerAuth: []
        clientId: []
      parameters: *id002
  /tenant/web/dim3d/scene:
    post:
      tags:
      - scene
      summary: 新建场景
      security:
      - bearerAuth: []
        clientId: []
      requestBody:
        required: true
