        '200':
          $ref: '#/components/schemas/PreviewResolveResponse'
  /operation/tenant/dashboard/list:
    get:
      tags:
      - base
      security:
      - bearerAuth: []
        clientId: []
      summary: 运营端可授权租户列表
      description: 仅运营端使用；租户端不能通过该路径枚举平台租户。
      parameters:
      - name: searchValue
        in: query
        schema:
          type: string
      - name: companyName
        in: query
        schema:
          type: string
      - name: tenantType
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: pageNum
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 租户分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    clientId:
      type: apiKey
      in: header
      name: ClientId
  parameters:
    SceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
    PreviewTicket:
      name: ticket
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    DictType:
      name: dictType
      in: path
      required: true
      description: 单个非空字典类型，最大长度与现有字典字段一致
      schema:
        type: string
        minLength: 1
        maxLength: 100
    OssId:
      name: ids
      in: path
      required: true
      description: 单个 wx_infra_file.id；首期不接受批量分隔值
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
  responses:
    LoginSuccess:
      description: 登录成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    ProfileSuccess:
      description: 当前资料
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileResponse'
    EmptySuccess:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyResponse'
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已认证但无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 锁、书签或幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 请求结构或四包校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OssFile:
      type: object
      required:
      - ossId
      - url
      - originalName
      - fileSuffix
      additionalProperties: false
      properties:
        ossId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: 本地 wx_infra_file.id 的十进制字符串，不等同于 ART resourceId
        url:
          type: string
          format: uri
          description: 最多 10 分钟的临时读取地址，不持久化
        originalName:
          type: string
          maxLength: 256
          description: 去除路径片段后的原始显示名称
        fileSuffix:
          type: string
          enum: [webp, svg, png, jpg, jpeg]
    OssFileResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/OssFile'
    OssFileListResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: array
            maxItems: 1
            items:
              $ref: '#/components/schemas/OssFile'
    Envelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
        data: {}
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: 'null'
    EmptyResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: 'null'
    OperationLoginRequest:
      type: object
      required:
      - clientId
      - accountType
      - phonenumber
      - password
      - grantType
      additionalProperties: false
      properties:
        clientId:
          type: string
          minLength: 1
        accountType:
          type: integer
          enum:
          - 2
        phonenumber:
          type: string
          pattern: ^1[3-9][0-9]{9}$
        password:
          type: string
          format: password
          minLength: 1
        grantType:
          type: string
          enum:
          - password
    TenantLoginRequest:
      allOf:
      - $ref: '#/components/schemas/OperationLoginRequest'
      - type: object
        required:
        - tenantCode
        properties:
          tenantCode:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    RefreshRequest:
      type: object
      required:
      - clientId
      - refreshToken
      - platformType
      additionalProperties: false
      properties:
        clientId:
          type: string
          minLength: 1
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
        platformType:
          type: string
          enum:
          - operation
          - tenant
    LoginResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - access_token
            - client_id
            - expire_in
            properties:
              access_token:
                type: string
                minLength: 1
                writeOnly: true
              client_id:
                type: string
                minLength: 1
              expire_in:
                type: integer
                minimum: 1
              refresh_token:
                type: string
                minLength: 1
                writeOnly: true
              refresh_expire_in:
                type: integer
                minimum: 1
    ProfileResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - user
            - roles
            - permissions
            properties:
              user:
                type: object
                required:
                - userId
                additionalProperties: true
              roles:
                type: array
                items:
                  type: string
              permissions:
