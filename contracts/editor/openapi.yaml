openapi: 3.0.3
info:
  title: wx-cloud Unity 编辑器接口
  version: 1.0.0
  description: M0-03 首批接口合同。编号按字符串传输；成功业务码固定为 200。访问令牌和 ClientId 由可信登录会话签发，tenant-id
    只作为一致性校验，不能覆盖令牌租户。应用 clientId 的实际值由部署配置登记，不写入合同。
  x-contract-status: frozen
  x-task: M0-03
  x-platform-paths:
    operation: /api/operation
    tenant: /api/tenant/web
    note: 已展开为实际路径；运营端使用 /api/operation，租户端使用 /api/tenant/web。
  x-contract-freeze-date: '2026-10-31'
servers:
- url: '{server}/api'
  variables:
    server:
      default: http://127.0.0.1:12522
      description: 业务网关地址；生产地址由环境配置注入
tags:
- name: auth
- name: base
- name: scene
- name: preview
paths:
  /system/dict/data/type/{dictType}:
    get:
      tags:
      - base
      summary: 按类型读取启用的字典项
      description: >-
        当前前端公共字典入口，不插入运营或租户平台段。网关精确改写到
        /admin-api/system/dict/data/type/{dictType}，沿用系统登录及租户一致性校验，
        不要求字典维护权限。复用已有服务按 sort 升序返回启用项；
        未配置或没有启用项时返回空数组，不伪造分类、不回退旧图标分类表。
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/DictType'
      responses:
        '200':
          description: 成功业务码为 200，data 始终为数组；编号按字符串传输
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /resource/oss/upload:
    post:
      tags:
      - resource
      summary: 上传带私有归属的普通文件
      description: >-
        IMG-01 合同基线。接收单个受限图片文件，ossId 指向本服务的 wx_infra_file.id；
        文件归属从可信令牌读取，不信任请求字段。路径不插入 operation 或 tenant/web 段。
        控制器显式使用 /infra/file/resource/oss 路径并添加管理前缀 /admin-api，网关目标为 /admin-api/infra/file/resource/oss/upload。
        当前前端 admin 模式还可使用同名 /admin-api/resource/oss/upload 别名，实际部署及页面联验按 IMG-06 记录。
      security:
      - bearerAuth: []
        clientId: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: WebP、SVG、PNG、JPG 或 JPEG；不超过 5 MiB
      responses:
        '200':
          description: 文件上传和元数据登记成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OssFileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 私有对象存储不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /resource/oss/listByIds/{ids}:
    get:
      tags:
      - resource
      summary: 按单个文件编号读取短期地址
      description: >-
        首期 ids 参数严格是一个正十进制本地普通文件编号；返回数组最多一项，
        编号不存在或不在当前身份可见范围时返回空数组。批量分隔语法不在本合同。
        当前候选 controller 前缀为 /infra/file/resource/oss/listByIds，网关目标须随代码映射联验。
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/OssId'
      responses:
        '200':
          description: 查询成功，data 为零项或一项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OssFileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /operation/dim3d/scene/page:
    get:
      tags:
      - scene
      summary: 场景分页
      security:
      - bearerAuth: []
        clientId: []
      parameters: &id002
      - name: sceneName
        in: query
        schema:
          type: string
      - name: sceneCategory
        in: query
        schema:
          type: string
      - name: sceneType
        in: query
        schema:
          type: string
          enum:
          - local3d
          - gis
      - name: sceneKind
        in: query
        schema:
          type: string
          enum:
          - INSTANCE
          - TEMPLATE
      - name: pageNum
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /operation/dim3d/scene:
    post:
      tags:
      - scene
      summary: 新建场景
      security:
      - bearerAuth: []
        clientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneForm'
      responses:
        '200':
          $ref: '#/components/schemas/SceneDetailResponse'
  /operation/dim3d/scene/{sceneId}:
    get:
      tags:
      - scene
      summary: 场景详情
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          $ref: '#/components/schemas/SceneDetailResponse'
    put:
      tags:
      - scene
      summary: 修改场景元数据
      security:
      - bearerAuth: []
        clientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneForm'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
      parameters:
      - $ref: '#/components/parameters/SceneId'
    delete:
      tags:
      - scene
      summary: 删除场景
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
  /operation/dim3d/scene/{sceneId}/copy:
    post:
      tags:
      - scene
      summary: 复制场景
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          $ref: '#/components/schemas/SceneDetailResponse'
  /operation/dim3d/scene/{sceneId}/lock:
    post:
      tags:
      - scene
      summary: 获取编辑锁
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      - name: clientKey
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/schemas/LockResponse'
  /operation/dim3d/scene/{sceneId}/heartbeat:
    post:
      tags:
      - scene
      summary: 续租编辑锁
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          $ref: '#/components/schemas/LockResponse'
  /operation/dim3d/scene/{sceneId}/unlock:
    delete:
      tags:
      - scene
      summary: 释放编辑锁
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      - name: clientKey
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
  /operation/dim3d/scene/saveAll:
    put:
      tags:
      - scene
      summary: 原子保存场景四包
      security:
      - bearerAuth: []
        clientId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAllRequest'
      responses:
        '200':
          $ref: '#/components/schemas/SaveAllResponse'
  /operation/dim3d/scenePreview/published/{publicationId}/sceneBasic:
    get:
      tags:
      - preview
      summary: 读取发布场景包
      security: []
      parameters: &id001
      - $ref: '#/components/parameters/PublicationId'
      - $ref: '#/components/parameters/PreviewTicket'
      responses:
        '200':
          $ref: '#/components/schemas/PublishedPackageResponse'
  /operation/dim3d/scenePreview/published/{publicationId}/threeD:
    get:
      tags:
      - preview
      summary: 读取发布三维包
      security: []
      parameters: *id001
      responses:
        '200':
          $ref: '#/components/schemas/PublishedPackageResponse'
  /operation/dim3d/scenePreview/published/{publicationId}/twoD:
    get:
      tags:
      - preview
      summary: 读取发布二维包
      security: []
      parameters: *id001
