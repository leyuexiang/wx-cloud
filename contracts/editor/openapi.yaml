      summary: 复制场景
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          $ref: '#/components/schemas/SceneDetailResponse'
  /tenant/web/dim3d/scene/{sceneId}/lock:
    post:
      tags:
      - scene
      summary: 获取编辑锁
      security:
      - bearerAuth: []
        clientId: []
      parameters:
      - $ref: '#/components/parameters/SceneId'
      - name: clientKey
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/schemas/LockResponse'
  /tenant/web/dim3d/scene/{sceneId}/heartbeat:
    post:
      tags:
