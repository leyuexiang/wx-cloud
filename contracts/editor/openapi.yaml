        '200':
          $ref: '#/components/schemas/PublishedPackageResponse'
  /operation/dim3d/scenePreview/published/{publicationId}/dependenciesByinstances:
    post:
      tags:
      - preview
      summary: 批量读取发布实例依赖
      security: []
