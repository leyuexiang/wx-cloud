          application/json:
            schema:
              $ref: '#/components/schemas/SceneForm'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
      parameters:
      - $ref: '#/components/parameters/SceneId'
    delete:
      tags:
