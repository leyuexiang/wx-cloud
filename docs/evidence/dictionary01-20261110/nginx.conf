# 148 编辑器验收入口，与现有后端、资源上传及下载入口分离。
map $http_origin $jtyf_editor148_download_origin {
    default "";
    "http://127.0.0.1:18065" $http_origin;
    "https://192.168.10.148:9447" $http_origin;
}

server {
    listen 192.168.10.148:9447 ssl;
    server_name 192.168.10.148;
    ssl_certificate /www/server/panel/vhost/cert/jtyf-web-art-20261028-133dd9a1e33e42c9/server.crt;
    ssl_certificate_key /www/server/panel/vhost/cert/jtyf-web-art-20261028-133dd9a1e33e42c9/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    allow 192.168.10.0/24;
    deny all;
    access_log off;
    error_log /opt/wx/editor-web148/nginx-error.log crit;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    root /opt/wx/editor-web148/site;

    # 字典分类只读转发；认证和租户校验由现有业务网关执行。
    location ~ "^/(?:api|admin-api)/system/dict/data/type/[A-Za-z0-9_-]{1,100}$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:12522;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # 图片分类数量来自已鉴权分页接口，只增加当前页面需要的只读转发。
    location = /admin-api/dim3d/icon/page {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:12522;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location = / { return 302 /threeWeb/; }
    location /threeWeb/ { try_files $uri $uri/ /threeWeb/index.html; }
    location ^~ /threeWeb/assets/ { try_files $uri =404; }

    location ~ "^/admin-api/dim3d/resources(?:/[1-9][0-9]{0,18}/(?:current|file))?$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:12522;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location ~ ^/admin-api/(?:system/(?:auth/(?:login|logout|get-permission-info)|dict-data/simple-list)|dim3d/(?:scene/(?:page|add|saveAll|info/[0-9]+|edit/[0-9]+|remove/[0-9]+|lock/[0-9]+|unlock/[0-9]+|heartbeat/[0-9]+)|model/page))$ {
        client_max_body_size 24m;
        proxy_pass http://127.0.0.1:12522;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location ~ ^/(?:bootstrap$|unity-web/|art/|session/) {
        proxy_pass http://127.0.0.1:5197;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
    }
    location / { return 404; }
}
